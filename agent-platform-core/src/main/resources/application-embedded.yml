# ============================================================
# 内置库模式（DB_MODE=embedded / --spring.profiles.active=embedded）
# 用 H2 file 库替换外部 MySQL：免安装即可运行；数据落 ./data/agent-platform.mv.db
# H2 以 MySQL 兼容模式启动（MODE=MySQL），Flyway 走 db/migration/h2 迁移集。
# 限制：无 FULLTEXT 全文索引，混合检索的稀疏侧在 H2 下由顺序扫描兜底（功能可用、量大时慢）；
#       生产/大数据场景请继续使用默认 MySQL（FULLTEXT + MATCH..AGAINST）。
# ============================================================
spring:
  config:
    activate:
      on-profile: embedded
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/agent-platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE}
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none          # schema 由 Flyway 管理
    open-in-view: false

# 桌面/单机模式下不部署 Redis：不把它计入健康检查（否则 /actuator/health 会因 redis DOWN 显示 503）
# H2 不支持 MySQL 的 MATCH(c.content) AGAINST(...)（native FULLTEXT），执行必然失败；
# 关闭后稀疏检索直接走顺序扫描兜底，同时避免那条失败 SQL 把查询事务标记为 rollback-only。
agent-platform:
  rag:
    fulltext:
      enabled: false
management:
  health:
    redis:
      enabled: false
    milvus:
      enabled: false
  endpoint:
    health:
      show-details: always
