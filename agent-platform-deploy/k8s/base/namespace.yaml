apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/part-of: agent-platform
---
# 资源配额（租户隔离 + 资源限制）
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-platform-quota
  namespace: agent-platform
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 64Gi
    limits.cpu: "64"
    limits.memory: 128Gi
    pods: "100"
---
# 限制范围（单 Pod 默认限制）
apiVersion: v1
kind: LimitRange
metadata:
  name: agent-platform-limit
  namespace: agent-platform
spec:
  limits:
    - default:
        cpu: "2"
        memory: 2Gi
      defaultRequest:
        cpu: "0.5"
        memory: 512Mi
      type: Container