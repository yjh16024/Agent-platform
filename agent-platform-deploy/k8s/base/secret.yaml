# 敏感配置（生产用外部密钥管理如 Vault / SealedSecrets，此处为示例占位）
apiVersion: v1
kind: Secret
metadata:
  name: agent-core-secret
  namespace: agent-platform
type: Opaque
stringData:
  MYSQL_PASSWORD: "change-me-mysql-password"
  REDIS_PASSWORD: "change-me-redis-password"
  # ⚠️ 这一项**必须替换**，否则 core 会启动失败：
  #   agent-platform.security.enabled 默认已为 true，而 SecurityStartupGuard 在
  #   「鉴权开启 + JWT 密钥仍是 change-me-* 默认值」时会 fail-fast 拒绝启动
  #   （防止"用公开默认密钥签发 token 访问全部租户数据"）。
  #   这里给的是**显式占位串**（不再是守卫识别的那个默认值），保证默认部署能跑起来；
  #   生产环境请换成 ≥32 字节随机串，并改由 SealedSecrets / Vault 注入。
  #   生成参考：openssl rand -base64 48
  JWT_SECRET: "REPLACE-ME-jwt-secret-at-least-32-bytes-use-openssl-rand-base64-48"
  LLM_API_KEY: "sk-local"
  AZURE_TTS_KEY: "change-me-azure-tts-key"
---
# TLS 证书（Ingress 用，示例占位，生产由 cert-manager 签发）
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-tls
  namespace: agent-platform
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    placeholder
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    placeholder
    -----END PRIVATE KEY-----