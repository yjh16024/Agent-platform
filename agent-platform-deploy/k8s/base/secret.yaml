# 敏感配置（生产用外部密钥管理如 Vault / SealedSecrets，此处为示例占位）
apiVersion: v1
kind: Secret
metadata:
  name: agent-core-secret
  namespace: agent-platform
type: Opaque
stringData:
  MYSQL_PASSWORD: "change-me-mysql-password"
  REDIS_PASSWORD: "change-me-redis-password"
  JWT_SECRET: "change-me-to-a-256-bit-secret-key-for-production-use-please"
  LLM_API_KEY: "sk-local"
  AZURE_TTS_KEY: "change-me-azure-tts-key"
---
# TLS 证书（Ingress 用，示例占位，生产由 cert-manager 签发）
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-tls
  namespace: agent-platform
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    placeholder
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    placeholder
    -----END PRIVATE KEY-----