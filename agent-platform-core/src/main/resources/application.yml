server:
  port: 8081
  tomcat:
    threads:
      virtual:
        enabled: true   # JDK 21 虚拟线程
    # 表单/附件总上限（与下方 spring.servlet.multipart 配合，避免被 Tomcat 层先拦下）
    max-swallow-size: 60MB

spring:
  application:
    name: agent-platform-core
  # ---- 文件上传（多模态资源入口）----
  # Spring Boot 默认单文件上限仅 1MB，会导致「文件页面传任何文件都失败」，
  # 这里放宽到与 FileUploadService.MAX_SIZE（50MB）一致。
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB
      file-size-threshold: 2MB
      resolve-lazily: true
  # ---- 静态资源（前端产物，同源托管）----
  # 统一 no-store：单机/桌面场景下缓存收益极低，但 Electron 会长期保留 HTTP 缓存，
  # 曾导致「后端产物已更新，桌面版仍加载旧 bundle → 工作流画布整页空白」。
  # 关掉后改前端无需 Ctrl+F5、桌面版重启即生效。
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  # ---- 数据源（MySQL 8.4）----
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/agent_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:agent}
    password: ${MYSQL_PASSWORD:agent123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none          # 由 Flyway 管理 schema
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    # 按数据库厂商选迁移目录：{vendor} = mysql / h2（Flyway 自动替换）
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
  # ---- Redis（缓存 + 二级缓存）----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  # ---- Kafka（事件总线）----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 3000        # broker 不可用时快速失败，避免阻塞主流程
        delivery.timeout.ms: 3000
    consumer:
      group-id: agent-platform-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# ---- Spring AI 模型网关（LiteLLM Proxy / OpenAI 兼容）----
spring.ai:
  openai:
    base-url: ${LLM_BASE_URL:http://localhost:4000}   # LiteLLM Proxy 地址
    api-key: ${LLM_API_KEY:sk-local}
    chat:
      options:
        model: ${DEFAULT_MODEL:gpt-4o-mini}
        temperature: 0.7

# ---- 平台配置 ----
agent-platform:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-for-production-use-please}
    expire-seconds: 86400            # 24h
  tenant:
    default-id: "default"
  # ---- Spring AI 通道开关（默认开启）----
  # true：OpenAI 兼容 / Anthropic 的模型调用改走 Spring AI 2.0.x 的 ChatModel（底层为官方厂商 SDK）；
  #       凭证三级回退、AES-GCM 加密与掩码逻辑不变（仍由 ModelBindingService / ModelKeyCrypto 负责）。
  # false：走自研 OkHttp 适配器（rule / mock 无论开关如何都走自研）。
  springai:
    enabled: ${SPRING_AI_ENABLED:true}
    # RAG 摄取走 Spring AI（解析 TikaDocumentReader + 切分 TokenTextSplitter）；设为 false 回退自研。
    rag:
      enabled: ${SPRING_AI_RAG_ENABLED:true}
  model:
    default-provider: ${DEFAULT_PROVIDER:deepseek}    # 智能体未配置 provider 时的默认模型厂商
    default-name: ${DEFAULT_MODEL:deepseek-chat}      # 智能体未配置 model 时的默认模型名
    # 发往模型厂商的 User-Agent（可用 MODEL_UA 覆盖；应对网关按 UA 拦截的瞬时风控）
    user-agent: ${MODEL_UA:Mozilla/5.0 (compatible; agent-platform/1.1)}
  # 嵌入模型（RAG 向量化）：运行时可经 /api/v1/model-config 直连云端嵌入
  # （默认走 LiteLLM 网关时的嵌入模型名；直连时模型名由绑定指定）
  embedding:
    default-model: ${EMBEDDING_MODEL:text-embedding-3-small}
  # 密钥加密主密钥：用于 AES-GCM 加密智能体在仪表盘填写的 API Key。
  # 生产环境务必覆盖（建议 32 字节随机串）；dev 默认值仅供本地/演示，泄露则密文可解。
  secrets:
    model-key: ${MODEL_KEY_ENC_KEY:change-me-model-key-encryption-32b}
  # ---- 智能体文件工作区（fs_* 工具的安全边界）----
  # 智能体只能读写 root 目录内的文件，越界一律拒绝（含符号链接绕过）。
  # 默认指向一个**空目录**，也就是"默认什么也读不到"—— 要让它帮你读改代码，
  # 请显式指到你项目的根目录，例如：
  #   AGENT_WORKSPACE_ROOT=D:/my-project   或   AGENT_WORKSPACE_ROOT=./  （当前目录）
  agent:
    workspace:
      enabled: ${AGENT_WORKSPACE_ENABLED:true}
      root: ${AGENT_WORKSPACE_ROOT:./data/workspace}
      max-read-bytes: 262144         # 单文件读取上限（256KB）
      max-entries: 500               # 单次目录列举 / glob 条目上限
      max-matches: 200               # 单次 grep 命中上限
      max-line-chars: 300            # grep 单行输出截断长度
      # 改前快照目录（回滚用）。⚠️ 务必放在**工作区之外**，
      # 否则 fs_glob / fs_grep 会把备份当成项目文件扫出来（本服务检测到会打 WARN）。
      snapshot-dir: ${AGENT_SNAPSHOT_DIR:./data/snapshots}
      snapshot-keep-days: 7          # 快照保留天数（撤销凭据，不是审计资料）
    approval:
      # 工具审批：写类工具会先提交申请，经人放行后才执行。
      # blocking-timeout-seconds > 0 时进入「就地确认」：工具调用会阻塞等用户点确认，
      # 界面上立刻弹出确认框，点完工具带着真实结果继续（模型侧无感）。
      # 超时未确认则降级为两步式（工具返回"已提交待审批"，用户稍后到工具审批页处理）——
      # 工作流 / 定时任务这类无人场景走的就是这条降级路径。
      blocking-timeout-seconds: ${AGENT_APPROVAL_TIMEOUT:300}
      keep-days: 7                   # 待审批保留期，超期自动作废（安全阀）
  # ---- 长期记忆：用户画像自动抽取（**默认关闭**）----
  # 开启后，每轮对话结束会**异步**调一次模型，从对话里识别关于用户的稳定事实，
  # 落成「待确认候选」——**不会直接生效**，用户在「长期记忆」页逐条采纳或忽略后才写进正式画像。
  #
  # 为什么默认关：这个能力会在用户背后记录关于他的事。让使用者显式打开比默认开启更合适，
  # 也避免既有部署升版后突然开始调额外的模型（有 token 成本）。
  # ⚠️ 抽取失败/超时会静默跳过，绝不影响对话本身。
  memory:
    auto-profile:
      enabled: ${MEMORY_AUTO_PROFILE_ENABLED:false}
      # 抽取用的模型。刻意**不复用本轮对话的模型** —— 抽取是"顺带做的事"，
      # 用固定默认更可预测，也免得把 provider/model 一路传下来。
      provider: ${MEMORY_AUTO_PROFILE_PROVIDER:deepseek}
      model: ${MEMORY_AUTO_PROFILE_MODEL:deepseek-chat}
  plugin:
    artifact-dir: ${PLUGIN_ARTIFACT_DIR:./data/plugins}
  # ---- Skills 目录（Agent Skills 开放标准布局）----
  # skills/<skill-name>/SKILL.md（YAML frontmatter + 提示词正文）+ 可选 scripts/ references/ assets/
  # 目录内新增/修改的 Skill 可直接经仪表盘「扫描同步」识别入库。
  skills:
    dir: ${SKILLS_DIR:./data/skills}
    # 是否允许从仪表盘打开该目录（本地桌面场景便利）。
    # 默认关闭：无桌面环境（服务器/容器/SSH）调用会失败，且存在在服务端启动文件管理器的安全隐患；
    # 需要时显式设置 SKILLS_OPEN_FOLDER=true 开启。
    open-folder-enabled: ${SKILLS_OPEN_FOLDER:false}
    # ---- 技能市场取件通道（多通道失败切换，见 SkillMarketService）----
    # sources 是通道**分组**的优先级顺序，可取值 jsdelivr / ghproxy / github，逗号分隔。
    # 默认 ghproxy,jsdelivr,github：代理优先（GitHub Trees API 目录完整准确），
    # jsDelivr 兜底（免代理、国内一般可达，但分支目录有缓存滞后，实测会少列部分技能）。
    # 某条通道不通时会自动切下一条，并把最近成功的通道记住优先复用。
    market:
      sources: ${SKILL_MARKET_SOURCES:ghproxy,jsdelivr,github}
      # jsDelivr 数据接口主机（列文件用，按顺序尝试）
      jsdelivr-api: ${SKILL_MARKET_JSDELIVR_API:data.jsdelivr.com}
      # jsDelivr CDN 主机（读文件用，按顺序失败切换）
      jsdelivr-cdns: ${SKILL_MARKET_JSDELIVR_CDNS:cdn.jsdelivr.net,gcore.jsdelivr.net,fastly.jsdelivr.net}
      # GitHub 加速代理（拼在目标地址前，需能同时代理 api.github.com 与 raw.githubusercontent.com）
      gh-proxies: ${SKILL_MARKET_GH_PROXIES:gh-proxy.com,ghfast.top,ghproxy.net}
      # 单次请求读超时（秒）
      timeout-seconds: ${SKILL_MARKET_TIMEOUT:25}
  log:
    kafka-topic: log-events
  # ---- 可观测性外推（阶段 B/C）----
  # 指标（Micrometer→/actuator/prometheus）默认开启；Loki/Tempo 仅在配置 URL 后启用。
  # 本地观测栈：docker compose -f docker-compose.observability.yml up -d
  observability:
    enabled: ${OBS_EXPORT_ENABLED:true}
    metrics:
      enabled: ${OBS_METRICS_ENABLED:true}
    loki:
      # 例 http://localhost:3100（容器网络用 http://loki:3100）
      url: ${OBS_LOKI_URL:}
      tenant-id: ${OBS_LOKI_TENANT:}
      batch-size: ${OBS_LOKI_BATCH_SIZE:200}
      flush-interval-ms: ${OBS_LOKI_FLUSH_MS:1000}
    tempo:
      # 例 http://localhost:9411（Tempo Zipkin 端口；容器网络用 http://tempo:9411）
      url: ${OBS_TEMPO_URL:}
      flush-interval-ms: ${OBS_TEMPO_FLUSH_MS:500}
    queue-capacity: ${OBS_QUEUE_CAPACITY:4096}
  # 生产鉴权：core 侧 JWT 兜底（true 后直连 8081 需 Bearer Token）
  # 2026-09-20 起**默认开启**（含 RBAC）。两个必须知道的配套项：
  #   1) SecurityStartupGuard 在「开启鉴权 + JWT 密钥仍为默认值」时会**拒绝启动**，
  #      所以必须提供 JWT_SECRET —— start-core.bat 里已给了一个本地开发用的固定值；
  #   2) 桌面（embedded）profile 会把它显式覆盖回 false：桌面版还没有登录页，
  #      开启后前端拿不到 token 会整体 401。等登录页落地（阶段 4）再打开。
  security:
    enabled: ${SECURITY_ENABLED:true}
    # RBAC（用户管理 + 角色权限管理）
    # true（默认）：登录走 sys_user 表并签发携带 roles 的 token，@RequiresPermission 生效；
    #              启动时由 RbacSeeder 同步权限点、创建内置角色（admin/operator/viewer）。
    # false       ：登录沿用「静态账号 / 演示模式」，接口不做权限校验。
    # 初始管理员密码：优先取环境变量 RBAC_ADMIN_PASSWORD，未设置则随机生成并打印到启动日志（仅首次）；
    #              已存在 admin 时若设了 RBAC_ADMIN_RESET_PASSWORD，则用它重置 admin 密码
    #              （忘记密码 / 部署时指定用；用完请立刻移除该环境变量）。
    rbac:
      enabled: ${RBAC_ENABLED:true}
  # Kafka 事件总线（配置变更广播 / 日志事件流）
  # 默认开启；broker 暂不可用时 KafkaEventBus 异步发送失败仅记 debug、不阻断主流程。
  # 桌面（embedded）profile 会显式覆盖为 false（单机无 broker，且已排除 Kafka 自动配置）。
  events:
    enabled: ${EVENTS_ENABLED:true}
    topics:
      config: agent-config-events
      log: log-events
  # RAG 向量存储：in-memory（默认，无外部依赖）/ milvus（接 Docker Milvus）
  rag:
    vector-store: ${VECTOR_STORE:in-memory}
    milvus:
      base-url: ${MILVUS_URL:http://localhost:19530}
      collection: agent_chunks
  # 文件存储：local（默认，本地磁盘）/ minio（接 Docker MinIO）
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/files}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}

# ---- 可观测性 ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.agentplatform: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.ai: INFO