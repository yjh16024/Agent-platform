apiVersion: v1
kind: Service
metadata:
  name: agent-core
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: agent-core
spec:
  type: ClusterIP
  selector:
    app: agent-core
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: 8081
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: agent-gateway
  namespace: agent-platform
spec:
  type: ClusterIP
  selector:
    app: agent-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# 网关对外暴露（生产建议用 Ingress / Istio Gateway）
apiVersion: v1
kind: Service
metadata:
  name: agent-gateway-external
  namespace: agent-platform
spec:
  type: LoadBalancer
  selector:
    app: agent-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP