apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app.kubernetes.io/name: agent-core
type: Opaque
stringData:
  MYSQL_PASSWORD: "{{ .Values.secrets.mysqlPassword }}"
  REDIS_PASSWORD: "{{ .Values.secrets.redisPassword }}"
  JWT_SECRET: "{{ .Values.secrets.jwtSecret }}"
  LLM_API_KEY: "{{ .Values.secrets.llmApiKey }}"